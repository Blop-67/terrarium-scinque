@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap');
.tz{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:16px;line-height:1.45}
.tz *{box-sizing:border-box}
.tz button,.tz select,.tz input{font:inherit;color:inherit}
.tz :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.h1{font-size:1.6rem;line-height:1.15;margin:0;font-weight:700;letter-spacing:-0.01em}
.h2{font-size:1.1rem;margin:14px 0 8px;font-weight:700}
.h3{font-size:1.15rem;margin:0 0 6px}
.q{font-size:1.15rem;font-weight:700;margin:12px 0 8px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.pad{padding:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 12px 6px;max-width:1500px;margin:0 auto}
.top p{margin:2px 0 0}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
.status{width:100%;font-size:.875rem;color:var(--muted)}
.legend{max-width:1476px;margin:6px 12px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media(min-width:1500px){.legend{margin:6px auto 0}}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;text-align:left}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.icon{min-width:44px;justify-content:center;padding:8px}
.btn[aria-pressed="true"]{background:var(--surface2);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);font-weight:700}
.btn.block{width:100%;flex-direction:column;align-items:flex-start;gap:2px}
.btn.grow,.grow{flex:1 1 auto;min-width:0}
.self-end{align-self:flex-end;margin-bottom:10px}
.layout{display:flex;flex-direction:column;gap:12px;padding:12px;max-width:1500px;margin:0 auto}
@media(min-width:1000px){.layout{flex-direction:row;align-items:flex-start}.stage{flex:1 1 auto;min-width:0;position:sticky;top:8px}.panel{width:420px;flex:0 0 420px;max-height:calc(100vh - 24px);overflow:auto}}
.stage{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.viewer3d{position:relative;height:52vh;min-height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--surface2)}
.vctrl{position:absolute;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:70%}
.vctrl .btn{background:var(--surface);opacity:.95}
.hint{position:absolute;left:8px;bottom:6px;margin:0;font-size:.8rem;background:var(--surface);color:var(--text);padding:4px 8px;border-radius:8px;max-width:calc(100% - 16px);opacity:.92}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);padding-bottom:6px}
.tab{min-height:44px;padding:8px 12px;border:none;background:none;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab.on{background:var(--surface2);color:var(--text);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.pane{padding-top:4px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.libbtn{font-size:.92rem}
.sw{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 4px;border-radius:6px;font-weight:700;font-size:.8rem;border:1px solid rgba(0,0,0,.35);flex:0 0 auto}
.objlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.objlist li{display:flex;gap:6px;align-items:center}
.objname{display:flex;flex-direction:column;overflow:hidden}
.objname small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:.92rem}
.field input,.field select{min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);width:100%}
.field input:disabled{opacity:.55}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.fs{border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin:6px 0 10px}
.fs legend{padding:0 6px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:12px}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:6px}
.dim{margin-bottom:6px}
.dimlab{display:block}
.dim input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;margin:8px 0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:1px 8px;border-radius:999px;border:1.5px solid;white-space:nowrap;vertical-align:middle;font-weight:700}
.b-src{border-style:solid;color:#1C5DA8;background:#E3EEFB}
.b-est{border-style:dashed;color:#7A4B00;background:#FFF1D6}
.b-hyp{border-style:dotted;color:#5B3E8A;background:#EFE8FA}
.codes{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem}
.codes li{display:flex;align-items:center;gap:6px}
.mini{border:1px solid var(--border);border-radius:10px;padding:4px;background:var(--bg)}
.cmpcol{min-width:0}
.tablewrap{overflow-x:auto;margin-top:10px}
.cmp{width:100%;border-collapse:collapse;font-size:.9rem}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.cmp tr.diff td{font-weight:700}
.neq{color:var(--danger)}
.log{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.log li{border-left:3px solid var(--border);padding-left:8px}
.foot{max-width:1500px;margin:0 auto;padding:4px 12px 24px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.modal{background:var(--surface);color:var(--text);border-radius:16px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto;border:1px solid var(--border)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{width:100%}
.recap{padding-left:18px}
.shot{width:100%;border-radius:10px;border:1px solid var(--border)}
.tabs{flex-wrap:wrap;overflow-x:visible}
.topinfo{max-width:1476px;margin:8px 12px 0;display:flex;flex-direction:column;gap:6px}
@media(min-width:1500px){.topinfo{margin:8px auto 0}}
.verdict{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:14px;border:2px solid}
.vtitle{font-size:1.1rem;margin-right:6px}
.v-ok{border-color:#2E7D4F;background:rgba(46,125,79,.12)}
.v-warn{border-color:#B7791F;background:rgba(230,159,0,.14)}
.v-bad{border-color:var(--danger);background:rgba(213,94,0,.14)}
.vline{padding:8px 12px;border-radius:10px;border:2px solid}
.disclaimer{margin:0;color:var(--muted)}
.note{background:var(--surface2);border-left:4px solid var(--accent);padding:8px 10px;border-radius:8px}
.st{display:inline-flex;gap:4px;align-items:center;font-weight:700;font-size:.85rem;white-space:nowrap}
.st-ok{color:#2E7D4F}.st-warn{color:#9A6400}.st-bad{color:var(--danger)}
.tz[data-dark="1"] .st-ok{color:#7FD3A0}.tz[data-dark="1"] .st-warn{color:#F2C063}
.chklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.chk{border:1px solid var(--border);border-left-width:6px;border-radius:10px;padding:8px 10px;background:var(--bg)}
.c-ok{border-left-color:#2E7D4F}.c-warn{border-left-color:#E69F00;border-left-style:dashed}.c-bad{border-left-color:var(--danger);border-left-style:double}
.advice{margin-top:4px}
.srcs{display:block;margin-top:4px}
.srcs a,.srclist a{color:var(--focus)}
.spcard{border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--bg)}
.conflict{color:var(--danger);font-weight:700;margin:2px 0}
.gauge{margin-bottom:10px}
.gbar{height:14px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.gfill{height:100%}
.g-ok{background:#2E7D4F}
.g-warn{background:repeating-linear-gradient(45deg,#E69F00 0 6px,#C98500 6px 12px)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:8px}
.rcard{border:1px solid var(--border);border-left-width:6px;border-radius:10px;padding:8px;background:var(--bg)}
.rval{font-size:1.05rem;font-weight:700;margin:2px 0}
.tl{margin:0 0 8px}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px}
.lg{display:inline-block;width:18px;height:10px;border-radius:3px;vertical-align:middle;margin-right:4px}
.lg.dash{background:none;border-top:3px dashed;height:0;border-radius:0}
.hm{margin:0}
.hmleg{display:flex;align-items:center;gap:6px;margin-top:4px}
.hmbar{flex:1;height:10px;border-radius:5px}
.hmgrid{align-items:start}
.range{width:100%;height:44px;accent-color:var(--accent)}
.mini-in{width:70px;min-height:40px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--bg)}
.modelinfo{margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.modelinfo summary,details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.srclist{padding-left:20px}
.groups{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.grp{font-weight:700}
.sublist{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:4px}
.out{width:100%;font:inherit;font-size:.85rem;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.emergency{border:2px solid var(--danger);border-radius:14px;padding:10px;margin-bottom:10px}
.steps{padding-left:22px;display:flex;flex-direction:column;gap:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.print-area{display:none}
tr.stale td{opacity:.6}
.terrsel{margin:0;min-width:200px}
.tour{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(460px,calc(100% - 24px));background:var(--surface);color:var(--text);border:2px solid var(--accent);border-radius:16px;padding:12px 14px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.tour-hl{outline:4px solid var(--focus)!important;outline-offset:4px;border-radius:14px}
.thumb{padding:0;border:1px solid var(--border);border-radius:8px;background:none;cursor:zoom-in;min-width:44px;min-height:44px;display:inline-flex}
.thumb img{object-fit:cover;border-radius:7px;display:block}
.preview{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.gallery{display:flex;flex-wrap:wrap;gap:10px}
.gallery figure{margin:0;width:100px}
.btn.disabled{opacity:.45;pointer-events:none}
.sheet h1{font-size:1.25rem;margin:0 0 8px}
.sheet h2{font-size:1rem;margin:10px 0 4px;border-bottom:1px solid currentColor}
.sheet p,.sheet li{margin:2px 0;font-size:.9rem}
.sheet ul,.sheet ol{padding-left:20px;margin:2px 0}
.sheet .big{font-size:1.3rem;font-weight:700}
.sheet-vet{border:2px solid var(--danger);border-radius:10px;padding:6px 10px}
.sheet-foot{font-size:.75rem;margin-top:10px}
.sheet-preview{border:1px dashed var(--border);border-radius:10px;padding:10px;margin-top:6px;background:var(--bg)}
@media print{
  .print-sheet{white-space:normal!important;font-size:10.5pt!important}
  .print-sheet .sheet-vet{border-color:#000}
  @page{margin:12mm}
}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{display:block;position:absolute;left:0;top:0;width:100%;white-space:pre-wrap;font:12pt/1.4 'Atkinson Hyperlegible',system-ui,sans-serif;color:#000;background:#fff}
